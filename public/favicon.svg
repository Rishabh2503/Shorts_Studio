<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded square background using the brand gradient (purple → cyan → pink). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#ff3ea5" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)" />
  <!--
    Sparkle / star glyph centred on the tile. White fill keeps it readable at
    every favicon size from 16px to 512px. The shape is a stylised 4-point
    star \u2014 same visual idea as the in-app AutoAwesomeIcon.
  -->
  <path
    d="M32 12 L36 26 L50 30 L36 34 L32 50 L28 34 L14 30 L28 26 Z"
    fill="#ffffff"
  />
  <!-- Two small accent stars so the tile feels lively at hero size. -->
  <circle cx="48" cy="16" r="2.2" fill="#ffffff" opacity="0.95" />
  <circle cx="16" cy="46" r="1.6" fill="#ffffff" opacity="0.85" />
</svg>
